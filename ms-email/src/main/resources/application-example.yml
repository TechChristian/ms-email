server:
  port: 8082
spring:
  application:
    name: email
  rabbitmq:
    addresses: YOUR_RABBITMQ_URL
  mail:
    host: smtp.gmail.com
    port: 587
    username: "YOUR_EMAIL"
    password: "YOUR_PASSWORD"
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  datasource:
    url: jdbc:postgresql://localhost:5432/ms-email
    username: YOUR_USERNAME_POSTGRES
    password: YOUR_PASSWORD_POSTGRES
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

broker:
  queue:
    email:
      welcome: welcome.email # Routing KEY